  e2e:
    <<: *signer-image
    # The acceptance driver is deliberately opt-in. The default Compose application is the
    # long-running daemon and signer network; a completed one-shot test must not
    # determine their lifecycle.
    profiles: [acceptance]
    command: [e2e, --scenario, /etc/threshold-monero/regtest-scenario.json]
    environment:
      RUST_LOG: threshold_monero=info
      TM_SCENARIO_FILE: /etc/threshold-monero/regtest-scenario.json
      TM_E2E_ADMIN_BEARER_TOKEN_DIRECTORY: /run/secrets
      TM_E2E_DEPOSIT_BEARER_TOKEN_DIRECTORY: /run/secrets
      # The official profile exercises real allocation/funding/permanence and fails closed unless
      # autonomous consolidation reaches exact signed/broadcast/confirmed status.
      TM_E2E_DEPOSITS: "1"
      TM_E2E_REQUIRE_DEPOSIT_CONSOLIDATION: "1"
    volumes:
      - ./docker/configs/regtest-scenario.json:/etc/threshold-monero/regtest-scenario.json:ro
      - ./docker/quic-pki:/etc/threshold-monero/quic:ro
    secrets:
      - source: demo-p1-admin-bearer-token
        target: p1-admin-bearer-token
      - source: demo-p2-admin-bearer-token
        target: p2-admin-bearer-token
      - source: demo-p3-admin-bearer-token
        target: p3-admin-bearer-token
      - source: demo-p4-admin-bearer-token
        target: p4-admin-bearer-token
      - source: demo-p5-admin-bearer-token
        target: p5-admin-bearer-token
      - source: demo-p6-admin-bearer-token
        target: p6-admin-bearer-token
      - source: demo-p7-admin-bearer-token
        target: p7-admin-bearer-token
      - source: demo-p8-admin-bearer-token
        target: p8-admin-bearer-token
      - source: demo-p1-deposit-bearer-token
        target: p1-deposit-bearer-token
      - source: demo-p2-deposit-bearer-token
        target: p2-deposit-bearer-token
      - source: demo-p3-deposit-bearer-token
        target: p3-deposit-bearer-token
      - source: demo-p4-deposit-bearer-token
        target: p4-deposit-bearer-token
      - source: demo-p5-deposit-bearer-token
        target: p5-deposit-bearer-token
      - source: demo-p6-deposit-bearer-token
        target: p6-deposit-bearer-token
      - source: demo-p7-deposit-bearer-token
        target: p7-deposit-bearer-token
      - source: demo-p8-deposit-bearer-token
        target: p8-deposit-bearer-token
    networks:
      - control
      - monero-mining
    depends_on:
      monerod-miner:
        condition: service_healthy
      p1:
        condition: service_healthy
      p2:
        condition: service_healthy
      p3:
        condition: service_healthy
      p4:
        condition: service_healthy
      p5:
        condition: service_healthy
      p6:
        condition: service_healthy
      p7:
        condition: service_healthy
      p8:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  # Operator/acceptance HTTP and peer endpoint discovery use distinct internal bridges, and no
  # port is host-published in this base file. Because party listeners bind wildcard addresses and
  # every party joins both bridges, this is endpoint organization rather than an L4 firewall;
  # bearer authentication remains the HTTP boundary. Scenario peer endpoints use only QUIC/UDP.
  control:
    internal: true
  # Only signer containers join this network. Peer protocol traffic targets QUIC over UDP/8443.
  peer-quic:
    internal: true
  # The acceptance driver can mine and submit only through the test block producer.
  monero-mining:
    internal: true
  # Fakechain block propagation is isolated from every signer RPC path.
  monero-p2p:
    internal: true
  # A separate bridge per party prevents accidental DNS/address fallback to another party's
  # observer. The scenario additionally requires every configured observer URL to be unique.
  monero-rpc-p1:
    internal: true
  monero-rpc-p2:
    internal: true
  monero-rpc-p3:
    internal: true
  monero-rpc-p4:
    internal: true
  monero-rpc-p5:
    internal: true
  monero-rpc-p6:
    internal: true
  monero-rpc-p7:
    internal: true
  monero-rpc-p8:
    internal: true

volumes:
  monerod-miner-regtest:
  monerod-p1-regtest:
  monerod-p2-regtest:
  monerod-p3-regtest:
  monerod-p4-regtest:
  monerod-p5-regtest:
  monerod-p6-regtest:
  monerod-p7-regtest:
  monerod-p8-regtest:
  p1-state:
  p2-state:
  p3-state:
  p4-state:
  p5-state:
  p6-state:
  p7-state:
  p8-state:

secrets:
  # Public deterministic signing-seed and genesis-member X25519 fixtures. The two key families
  # are deliberately independent. Post-genesis-only parties never receive an epoch-zero secret.
  demo-p1-signing-seed:
    file: ./docker/demo-secrets/p1-signing-seed.hex
  demo-p2-signing-seed:
    file: ./docker/demo-secrets/p2-signing-seed.hex
  demo-p3-signing-seed:
    file: ./docker/demo-secrets/p3-signing-seed.hex
  demo-p4-signing-seed:
    file: ./docker/demo-secrets/p4-signing-seed.hex
  demo-p5-signing-seed:
    file: ./docker/demo-secrets/p5-signing-seed.hex
  demo-p6-signing-seed:
    file: ./docker/demo-secrets/p6-signing-seed.hex
  demo-p7-signing-seed:
    file: ./docker/demo-secrets/p7-signing-seed.hex
  demo-p8-signing-seed:
    file: ./docker/demo-secrets/p8-signing-seed.hex
  demo-p1-bootstrap-x25519-secret:
    file: ./docker/demo-secrets/p1-bootstrap-x25519-secret.hex
  demo-p2-bootstrap-x25519-secret:
    file: ./docker/demo-secrets/p2-bootstrap-x25519-secret.hex
  demo-p3-bootstrap-x25519-secret:
    file: ./docker/demo-secrets/p3-bootstrap-x25519-secret.hex
  demo-p4-bootstrap-x25519-secret:
    file: ./docker/demo-secrets/p4-bootstrap-x25519-secret.hex
  demo-p5-bootstrap-x25519-secret:
    file: ./docker/demo-secrets/p5-bootstrap-x25519-secret.hex
  # Public deterministic transport-key fixtures. Compose exposes only the matching key to each
  # party and mounts it read-only. Replace these with a real secret manager outside this demo.
  demo-p1-quic-private-key:
    file: ./docker/demo-secrets/p1-quic-key.der
  demo-p2-quic-private-key:
    file: ./docker/demo-secrets/p2-quic-key.der
  demo-p3-quic-private-key:
    file: ./docker/demo-secrets/p3-quic-key.der
  demo-p4-quic-private-key:
    file: ./docker/demo-secrets/p4-quic-key.der
  demo-p5-quic-private-key:
    file: ./docker/demo-secrets/p5-quic-key.der
  demo-p6-quic-private-key:
    file: ./docker/demo-secrets/p6-quic-key.der
  demo-p7-quic-private-key:
    file: ./docker/demo-secrets/p7-quic-key.der
  demo-p8-quic-private-key:
    file: ./docker/demo-secrets/p8-quic-key.der
  # Every signer receives only its own HTTP capabilities. Sharing one token across parties would
  # let a compromised signer administer or impersonate a deposit client to every honest peer.
  demo-p1-admin-bearer-token:
    file: ./docker/demo-secrets/p1-admin-bearer-token.txt
  demo-p2-admin-bearer-token:
    file: ./docker/demo-secrets/p2-admin-bearer-token.txt
  demo-p3-admin-bearer-token:
    file: ./docker/demo-secrets/p3-admin-bearer-token.txt
  demo-p4-admin-bearer-token:
    file: ./docker/demo-secrets/p4-admin-bearer-token.txt
  demo-p5-admin-bearer-token:
    file: ./docker/demo-secrets/p5-admin-bearer-token.txt
  demo-p6-admin-bearer-token:
    file: ./docker/demo-secrets/p6-admin-bearer-token.txt
  demo-p7-admin-bearer-token:
    file: ./docker/demo-secrets/p7-admin-bearer-token.txt
  demo-p8-admin-bearer-token:
    file: ./docker/demo-secrets/p8-admin-bearer-token.txt
  demo-p1-deposit-bearer-token:
    file: ./docker/demo-secrets/p1-deposit-bearer-token.txt
  demo-p2-deposit-bearer-token:
    file: ./docker/demo-secrets/p2-deposit-bearer-token.txt
  demo-p3-deposit-bearer-token:
    file: ./docker/demo-secrets/p3-deposit-bearer-token.txt
  demo-p4-deposit-bearer-token:
    file: ./docker/demo-secrets/p4-deposit-bearer-token.txt
  demo-p5-deposit-bearer-token:
