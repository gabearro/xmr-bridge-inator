name: threshold-monero-regtest

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-monero-image: &monero-image
  image: threshold-monero/monerod:0.18.5.1
  # Never fall back to an image with this local-looking name from a registry. `build` and
  # `up --build` still use the build section below explicitly.
  pull_policy: never
  logging: *bounded-logging
  build:
    context: .
    dockerfile: Dockerfile.monero

x-monero-node: &monero-node
  <<: *monero-image
  cpus: 0.75
  mem_limit: 512m
  pids_limit: 128
  environment:
    HOME: /data
  expose:
    - "18081"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  restart: unless-stopped
  healthcheck:
    test: [CMD, /usr/local/bin/monero-healthcheck, daemon]
    interval: 5s
    timeout: 3s
    retries: 60
    start_period: 5s

x-monero-observer: &monero-observer
  <<: *monero-node
  command:
    [monerod, --config-file=/etc/monero/monerod-observer.conf, --non-interactive]
  healthcheck:
    test:
      [CMD, /usr/local/bin/monero-healthcheck, observer,
       http://127.0.0.1:18081/json_rpc, http://monerod-miner:18081/json_rpc]
    interval: 5s
    timeout: 7s
    retries: 60
    start_period: 5s

x-signer-image: &signer-image
  image: threshold-monero/signer:local
  # Never fall back to an image with this local-looking name from a registry. `build` and
  # `up --build` still use the build section below explicitly.
  pull_policy: never
  logging: *bounded-logging
  cpus: 1.0
  mem_limit: 768m
  pids_limit: 256
  build:
    context: .
    dockerfile: Dockerfile

x-party-environment: &party-environment
  RUST_LOG: threshold_monero=info,tower_http=info
  TM_ADMIN_LISTEN_ADDR: 0.0.0.0:8080
  TM_QUIC_LISTEN_ADDR: 0.0.0.0:8443
  TM_QUIC_PRIVATE_KEY_FILE: /run/secrets/quic_private_key
  TM_ADMIN_BEARER_TOKEN_FILE: /run/secrets/admin_bearer_token
  TM_DEPOSIT_BEARER_TOKEN_FILE: /run/secrets/deposit_bearer_token
  TM_DEPOSIT_VIEW_KEY_FILE: /run/secrets/deposit_view_key
  TM_STATE_DIR: /var/lib/threshold-monero
  TM_SIGNING_SEED_FILE: /run/secrets/signing_seed
  TM_SCENARIO_FILE: /etc/threshold-monero/regtest-scenario.json
  # Each eligible epoch-zero member durably starts only its own canonical dealer role. QUIC
  # outbox retry makes simultaneous container startup and ordinary process restart idempotent.
  TM_AUTO_START_GENESIS: "true"

x-party-common: &party-common
  <<: *signer-image
  command: [party]
  environment: *party-environment
  expose:
    - "8080/tcp"
    - "8443/udp"
  # Do not gate identity restore, QUIC, DKG, QUAL, or proactive refresh on chain RPC
  # availability. Deposit workers connect lazily and retry after monerod recovers.
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 15s
  restart: unless-stopped
  healthcheck:
    test: [CMD, /usr/local/bin/party-healthcheck]
    interval: 5s
    timeout: 3s
    retries: 90
    start_period: 5s

services:
  monerod-miner:
    <<: *monero-node
    command: [monerod, --config-file=/etc/monero/monerod-miner.conf, --non-interactive]
    volumes:
      - monerod-miner-regtest:/data
      - ./docker/configs/monerod-regtest-miner.conf:/etc/monero/monerod-miner.conf:ro
    networks:
      - monero-p2p
      - monero-mining

  monerod-p1:
    <<: *monero-observer
    volumes:
      - monerod-p1-regtest:/data
      - ./docker/configs/monerod-regtest-observer.conf:/etc/monero/monerod-observer.conf:ro
    networks:
      - monero-p2p
      - monero-rpc-p1

