# Independent private-Regtest observer. Every signer has a separate process, storage volume, and
# RPC network. The exclusive peer is the test block producer; production deployments must replace
# this test-only peer topology with independently administered and network-diverse Monero nodes.
regtest=1
keep-fakechain=1
fixed-difficulty=1
data-dir=/data

p2p-bind-ip=0.0.0.0
p2p-bind-port=18080
allow-local-ip=1
add-exclusive-node=monerod-miner:18080
in-peers=0
out-peers=1
hide-my-port=1
no-igd=1

rpc-bind-ip=0.0.0.0
rpc-bind-port=18081
confirm-external-bind=1
rpc-ssl=disabled
rpc-max-connections=32
rpc-max-connections-per-private-ip=32

no-zmq=1
disable-dns-checkpoints=1
check-updates=disabled
log-level=0
