# Private deterministic block producer for acceptance only. Never expose this unrestricted RPC
# endpoint outside the isolated Compose network.
regtest=1
keep-fakechain=1
fixed-difficulty=1
data-dir=/data

p2p-bind-ip=0.0.0.0
p2p-bind-port=18080
allow-local-ip=1
in-peers=16
out-peers=0
hide-my-port=1
no-igd=1

rpc-bind-ip=0.0.0.0
rpc-bind-port=18081
confirm-external-bind=1
rpc-ssl=disabled
rpc-max-connections=100
rpc-max-connections-per-private-ip=100

no-zmq=1
disable-dns-checkpoints=1
check-updates=disabled
log-level=0
